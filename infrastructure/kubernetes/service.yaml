apiVersion: v1
kind: Service
metadata:
  name: nodejs-hello-world
  labels:
    app: nodejs-hello-world
    component: backend
  annotations:
    description: "Service for Node.js Hello World HTTP server"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: nodejs-hello-world