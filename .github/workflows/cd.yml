name: Node.js CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and test the Node.js application
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package.json'
      
      - name: Install dependencies
        working-directory: src/backend
        run: npm ci
      
      - name: Lint code
        working-directory: src/backend
        run: npm run lint
      
      - name: Run tests with coverage
        working-directory: src/backend
        run: npm run test:coverage

  deploy:
    name: Deploy the application to the target environment
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Generate image metadata
        id: meta
        run: echo "version=$(git describe --tags --always || echo 'v0.1.0')" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infrastructure/Dockerfile
          push: false
          tags: nodejs-hello-world:${{ steps.meta.outputs.version }},nodejs-hello-world:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to Docker
        if: github.ref == 'refs/heads/main'
        run: chmod +x ./infrastructure/scripts/deploy.sh && ./infrastructure/scripts/deploy.sh -t docker